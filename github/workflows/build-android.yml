name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '26.1.10909125'
          cmake-version: '3.22.1'

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: /usr/local/share/vcpkg
          key: vcpkg-android-${{ hashFiles('.github/workflows/build-android.yml') }}

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git /usr/local/share/vcpkg
          /usr/local/share/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=/usr/local/share/vcpkg" >> $GITHUB_ENV

      - name: Install Android dependencies via vcpkg
        run: |
          /usr/local/share/vcpkg/vcpkg install boost-system:arm64-android
          /usr/local/share/vcpkg/vcpkg install boost-filesystem:arm64-android
          /usr/local/share/vcpkg/vcpkg install boost-program-options:arm64-android
          /usr/local/share/vcpkg/vcpkg install boost-icl:arm64-android
          /usr/local/share/vcpkg/vcpkg install boost-variant:arm64-android
          /usr/local/share/vcpkg/vcpkg install openssl:arm64-android
          /usr/local/share/vcpkg/vcpkg install zlib:arm64-android

      - name: Set environment variables
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace --configuration-cache --build-cache --parallel --configure-on-demand assembleReldebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-Android-APK
          path: android/app/build/outputs/apk/reldebug/*.apk
          retention-days: 30
